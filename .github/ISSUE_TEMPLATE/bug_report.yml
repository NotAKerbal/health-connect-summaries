name: Bug report
description: Something doesn't work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Don't include health data, screenshots of real data, your Site URL, connection codes,
        tokens, or logs with identifiers.** Use made-up values. Security issues: see SECURITY.md.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Android app, Site dashboard, ChatGPT plugin, Setup or docs]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "App 0.5.0, pinned or generic build, Android 15"
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This report contains no health data, Site URL, codes, tokens, or personal identifiers.
          required: true
