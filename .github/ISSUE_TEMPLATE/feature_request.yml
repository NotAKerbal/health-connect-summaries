name: Feature request
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea (optional)
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This request contains no health data or personal identifiers.
          required: true
